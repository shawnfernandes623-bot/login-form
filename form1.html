<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login form</title>
    <link rel="stylesheet" href="form1.css">
</head>
<body>
    <div class="outer-box">
        <div class="inner-box">
            <header class="signup-header">
                <h1>signup</h1>
                <p>it just take 30 sec</p>
            </header>
            <main class="signup-body">
                <form action="#">
                    <p>
                        <label for="ok">first name</label>
                         <input id="ok" type="text" placeholder="shawn steven fernandes" required>
                    </p>
                    <p>
                        <label for="ok1">your email</label>
                         <input id="ok1" type="email" placeholder="shawnfernandes623@gmail.com" required>
                    </p>
                    <p>
                        <label for="ok3">your password</label>
                         <input id="ok3" type="password" placeholder="atleast 8 charachters" required>
                    </p>
                    <p>
                       <input type="submit" id="submit" value="create an account">
                    </p>
                   
                </form>
            </main>
             <footer>
                <p>
                    already have an account?<a href="#">login</a>
                </p>
                      </footer>


        </div>
    
    </div>

    
</body>
</html>
